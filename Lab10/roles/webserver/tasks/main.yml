      - name: sakerstall installation av apache
        ansible.builtin.apt:
          update_cache: true      
          name: apache2

      - name: sakerstall att apache ar på
        ansible.builtin.service:
          name: apache2
          state: started
        notify: starta om apache

      - name: Skapa en jinja template + skicka over till noden
        ansible.builtin.template:
          src: index.html.j2
          dest: /var/www/html/index.html
        notify: starta om apache




